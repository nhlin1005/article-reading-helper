<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Glossary</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root { --header-height: 64px; }
    body, html {
      height: 100%; overflow: hidden; margin: 0; padding: 0;
      background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;
    }

    .upload-logo { position: absolute; top: 50%; width: 120px; }
    .upload-logo-left  { left: -120px; transform: translateY(-50%); }
    .upload-logo-right { right: -120px; transform: translateY(-50%) scaleX(-1); }

    .sidebar-header, .content-header {
      height: var(--header-height);
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      border-bottom: 1px solid #f0f2f5;
      background-color: white;
    }

    .custom-card {
      border-radius: 16px;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border: none;
    }

    .scroll-container::-webkit-scrollbar { width: 4px; }
    .scroll-container::-webkit-scrollbar-track { background: transparent; }
    .scroll-container::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 10px; }

    .header-action-area { width: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Flashcard (Collections view) */
    .flip-card { background-color: transparent; width: 420px; height: 320px; perspective: 1000px; cursor: pointer; flex-shrink: 0; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 24px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
    .flip-card-back { background-color: white; transform: rotateY(180deg); }

    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px);  } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft  { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    .slide-right { animation: slideInRight 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .slide-left  { animation: slideInLeft  0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #root { height: 100%; }
    .app-container { height: 100vh; width: 100vw; padding: 1.5rem; display: flex; flex-direction: column; }

    #sidebar-container { height: 100%; width: 300px; flex-shrink: 0; }
    .sidebar-layer { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .list-group-item.active-word { background-color: #f8f9fa !important; border-left: 4px solid #0d6efd !important; }

    .nav-btn {
      width: 48px; height: 48px;
      border: 1px solid #eee; background: white;
      transition: all 0.2s ease; z-index: 5;
    }
    .nav-btn:hover { background: #f8f9fa; transform: scale(1.05); }

    /* ─────────────────────────────────────────────────
       PDF HOST — scroll fix
       position:absolute + inset:0 fills the
       position:relative parent (min-height:0 set inline).
       overflow:auto enables scrolling.
    ───────────────────────────────────────────────── */
    .pdf-host {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: auto;
      background: #f6f7fb;
      border-radius: 16px;
    }
    .pdf-pages {
      padding: 20px;
      display: flex; flex-direction: column; gap: 18px; align-items: center;
      min-height: 100%;
    }
    .pdf-page {
      position: relative; background: white; flex-shrink: 0;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.06); overflow: hidden;
    }
    .pdf-canvas { display: block; }

    /* ─────────────────────────────────────────────────
       TEXT LAYER
       pointer-events:none on wrapper → scroll/wheel fall through to .pdf-host
       pointer-events:auto on spans   → text remains selectable
       ::selection transparent        → hides native blue; our hl-box shows highlights
    ───────────────────────────────────────────────── */
    .textLayer {
      position: absolute;
      left: 0; top: 0;
      transform-origin: 0 0;
      pointer-events: none;
      user-select: text;
    }
    .textLayer > span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      pointer-events: auto;
      transform-origin: 0% 0%;
    }
    .textLayer ::selection { background: transparent; }

    /* Highlight overlay */
    .hl-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .hl-box   { position: absolute; background: rgba(255,235,59,.55); border-radius: 3px; }

    /* Selection toolbar */
    .sel-toolbar {
      position: fixed; z-index: 9999;
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 12px 30px rgba(0,0,0,.15);
      border-radius: 999px; padding: 8px 10px;
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(6px);
    }
    .tb-btn {
      border: 0; background: transparent; padding: 6px 10px;
      border-radius: 999px; font-size: 13px; line-height: 1;
      display: inline-flex; gap: 6px; align-items: center;
    }
    .tb-btn:hover { background: rgba(0,0,0,.06); }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Selection toolbar (fixed overlay, shown on text selection in PDF) -->
  <div id="selToolbar" class="sel-toolbar d-none">
    <button class="tb-btn" data-act="highlight" title="Highlight"><i class="bi bi-highlighter"></i>Highlight</button>
    <button class="tb-btn" data-act="copy"      title="Copy"><i class="bi bi-clipboard"></i>Copy</button>
    <button class="tb-btn" data-act="speak"     title="Read aloud"><i class="bi bi-volume-up"></i></button>
  </div>

  <script type="module">
    import * as pdfjsLib from "/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdf.worker.min.mjs";

    /* ══════════════════════════════════════════
       STATE
    ══════════════════════════════════════════ */
    const state = {
      view: 'upload',           // 'upload' | 'content' | 'collections'
      fileData: null,
      words: [],
      wordData: {},
      favorites: new Set(),
      viewSnapshot: [],         // snapshot of favorites when entering Collections
      isProcessing: false,
      selectedWord: null,
      collectionIndex: 0,
      isFlipped: false,
      currentAnim: 'slide-right',

      pdfZoom: 1.25,
      pdfBuf: null,
      _pdfRenderedScale: null,

      articleText: "",
      articleTextLoaded: false,
    };

    const STORAGE_KEY = "smartGlossaryStateV1";

    /* ── helpers ── */
    const escapeHtml = (s) => String(s || "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");

    const cancelSpeech = () => { try { window.speechSynthesis.cancel(); } catch {} };

    const speakTextLocal = (text) => {
      const t = (text || "").trim(); if (!t) return;
      cancelSpeech();
      const u = new SpeechSynthesisUtterance(t); u.rate = 1.0;
      window.speechSynthesis.speak(u);
    };
    window.playWord = (word) => speakTextLocal(word);

    const normalizeSel = (t) =>
      (t || "")
        .replace(/\u00AD/g, "")
        .replace(/-\s+/g, "")
        .replace(/\s+/g, " ")
        .replace(/[""]/g, '"')
        .replace(/[']/g, "'")
        .trim();

    /* ── persistence ── */
    const loadPersistedState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
        const saved = JSON.parse(raw);
        if (Array.isArray(saved.favorites)) state.favorites = new Set(saved.favorites);
        if (saved.wordData && typeof saved.wordData === "object") {
          // Only restore entries that actually have content — discard empty/failed lookups
          // so they get re-fetched fresh next time the word is opened or added.
          const clean = {};
          for (const [k, v] of Object.entries(saved.wordData)) {
            if ((v.meaning || "").trim() || (v.example || "").trim()) clean[k] = v;
          }
          state.wordData = clean;
        }
      } catch {}
    };

    const persistState = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          favorites: Array.from(state.favorites),
          wordData:  state.wordData,
        }));
      } catch {}
    };

    /* ══════════════════════════════════════════
       PDF RENDERING
       Each page = canvas (visual) + textLayer (invisible selection overlay)
    ══════════════════════════════════════════ */
    let _pdfDoc = null;

    const ensureHighlightLayer = (pageWrap) => {
      let layer = pageWrap.querySelector(".hl-layer");
      if (!layer) {
        layer = document.createElement("div");
        layer.className = "hl-layer";
        pageWrap.appendChild(layer);
      }
      return layer;
    };

    const renderPdfPage = async (page, pageNum, host) => {
      const viewport = page.getViewport({ scale: state.pdfZoom || 1.25 });
      const W = Math.floor(viewport.width);
      const H = Math.floor(viewport.height);

      const pageWrap = document.createElement("div");
      pageWrap.className = "pdf-page";
      pageWrap.dataset.page = String(pageNum);
      pageWrap.style.width  = `${W}px`;
      pageWrap.style.height = `${H}px`;

      const canvas = document.createElement("canvas");
      canvas.className = "pdf-canvas";
      canvas.width = W; canvas.height = H;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

      /* text layer — PDF.js v4 needs --scale-factor CSS var */
      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "textLayer";
      textLayerDiv.style.width  = `${W}px`;
      textLayerDiv.style.height = `${H}px`;
      textLayerDiv.style.setProperty("--scale-factor", String(viewport.scale));

      pageWrap.appendChild(canvas);
      ensureHighlightLayer(pageWrap);
      pageWrap.appendChild(textLayerDiv);
      host.appendChild(pageWrap);

      const textContent = await page.getTextContent();
      await new pdfjsLib.TextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport,
      }).render();
    };

    const renderPdfFromArrayBuffer = async (buf) => {
      const host = document.getElementById("pdfPages");
      if (!host) return;
      host.innerHTML = `<div class="p-4 text-muted small">Rendering PDF…</div>`;
      const bytes = new Uint8Array(buf.slice(0));   // copy: workers detach buffers
      _pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
      host.innerHTML = "";
      for (let n = 1; n <= _pdfDoc.numPages; n++)
        await renderPdfPage(await _pdfDoc.getPage(n), n, host);
    };

    const loadPdfIntoViewer = async (force = false) => {
      if (!state.pdfBuf) return;
      const host  = document.getElementById("pdfPages");
      const empty = !host || host.children.length === 0;
      if (!force && !empty && state._pdfRenderedScale === state.pdfZoom) return;
      await renderPdfFromArrayBuffer(state.pdfBuf);
      state._pdfRenderedScale = state.pdfZoom;
      setupPdfSelectionToolbar();
    };

    window.zoomPdf = (delta) => {
      const next = Math.max(0.6, Math.min(2.5, (state.pdfZoom || 1.25) + delta));
      state.pdfZoom = Math.round(next * 10) / 10;
      state._pdfRenderedScale = null;
      render();
      setTimeout(() => loadPdfIntoViewer(true).catch(console.error), 0);
    };

    /* ══════════════════════════════════════════
       SELECTION TOOLBAR
       passive:true on scroll/wheel = browser scrolls immediately
       without waiting for these handlers.
    ══════════════════════════════════════════ */
    const setupPdfSelectionToolbar = () => {
      const host    = document.getElementById("pdfHost");
      const toolbar = document.getElementById("selToolbar");
      if (!host || !toolbar || host.dataset.bound === "1") return;
      host.dataset.bound = "1";

      let lastSelText = "";

      const getSel     = () => window.getSelection ? window.getSelection() : null;
      const getSelText = () => { const s = getSel(); return s ? s.toString().trim() : ""; };
      const getSelRect = () => {
        const s = getSel(); if (!s || s.rangeCount === 0) return null;
        const rects = s.getRangeAt(0).getClientRects();
        return (rects && rects.length) ? rects[0] : null;
      };

      const showToolbar = (rect) => {
        toolbar.style.left      = `${Math.max(10, Math.min(window.innerWidth - 200, rect.left + rect.width / 2))}px`;
        toolbar.style.top       = `${Math.max(10, rect.top - 52)}px`;
        toolbar.style.transform = "translateX(-50%)";
        toolbar.classList.remove("d-none");
      };
      const hideToolbar = () => { toolbar.classList.add("d-none"); cancelSpeech(); };

      const highlightSelection = () => {
        const sel = getSel(); if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        const rects = Array.from(range.getClientRects()); if (!rects.length) return;
        const anchor = sel.anchorNode?.parentElement;
        const pageEl = anchor ? anchor.closest(".pdf-page") : null; if (!pageEl) return;
        const layer    = ensureHighlightLayer(pageEl);
        const pageRect = pageEl.getBoundingClientRect();
        rects.forEach(r => {
          const box = document.createElement("div");
          box.className  = "hl-box";
          box.style.left   = `${r.left   - pageRect.left}px`;
          box.style.top    = `${r.top    - pageRect.top}px`;
          box.style.width  = `${r.width}px`;
          box.style.height = `${r.height}px`;
          layer.appendChild(box);
        });
        sel.removeAllRanges();
        hideToolbar();
      };

      const copySelection = async () => {
        if (!lastSelText) return;
        try { await navigator.clipboard.writeText(lastSelText); }
        catch {
          const ta = document.createElement("textarea"); ta.value = lastSelText;
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); document.body.removeChild(ta);
        }
      };

      host.addEventListener("mouseup", () => {
        setTimeout(() => {
          const text = getSelText();
          if (!text) { hideToolbar(); return; }
          lastSelText = text;
          const rect = getSelRect();
          if (rect) showToolbar(rect);
        }, 0);
      });

      /* passive = browser never waits for JS before scrolling */
      host.addEventListener("scroll", () => {
        hideToolbar();
        try { window.getSelection()?.removeAllRanges(); } catch {}
      }, { passive: true });
      host.addEventListener("wheel",     () => {}, { passive: true });
      host.addEventListener("touchmove", () => {}, { passive: true });

      document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideToolbar(); });

      toolbar.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]"); if (!btn) return;
        const act = btn.dataset.act;
        if (act === "highlight") highlightSelection();
        if (act === "copy")      await copySelection();
        if (act === "speak")     speakTextLocal(lastSelText);   // speak only selected text
      });

      document.addEventListener("mousedown", () => {
        setTimeout(() => { if (!getSelText()) hideToolbar(); }, 0);
      });
    };

    /* ══════════════════════════════════════════
       WORD DEFINITIONS
    ══════════════════════════════════════════ */
    const ensureWordData = async (word) => {
      const cur = state.wordData[word] || {};
      if ((cur.meaning || "").trim() && (cur.example || "").trim()) return;
      try {
        const resp = await fetch("/api/lookup_word", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ word }),
        });
        if (!resp.ok) return;
        const data = await resp.json().catch(() => ({}));
        state.wordData[word] = {
          meaning: (data.meaning || cur.meaning || "").trim(),
          example: (data.example || cur.example || "").trim(),
          ipa:     (data.ipa     || cur.ipa     || "").trim(),
          ipa_us:  (data.ipa_us  || cur.ipa_us  || "").trim(),
          ipa_uk:  (data.ipa_uk  || cur.ipa_uk  || "").trim(),
        };
        persistState();
      } catch {}
    };

    const getDetailHtmlSnippet = (word) => {
      const data = state.wordData[word] || {};
      const ipa  = (data.ipa || data.ipa_us || data.ipa_uk || "").trim();
      return `
        <div class="p-4 fade-in">
          <div class="mb-3">
            <div class="d-flex align-items-center gap-2">
              ${ipa ? `<div class="text-muted" style="font-size: 0.9rem">/${escapeHtml(ipa)}/</div>` : ""}
              <button class="btn btn-sm btn-outline-primary rounded-pill"
                      onclick='window.playWord(${JSON.stringify(word)})' title="Read word">
                <i class="bi bi-volume-up me-1"></i>Play
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label class="text-uppercase text-secondary fw-bold small mb-2 d-block"
                   style="letter-spacing: 1px; font-size: 0.65rem">Definition</label>
            <p class="text-dark small lh-lg mb-0">${escapeHtml(data.meaning || "No definition available.")}</p>
          </div>
          <div>
            <label class="text-uppercase text-secondary fw-bold small mb-2 d-block"
                   style="letter-spacing: 1px; font-size: 0.65rem">Example</label>
            <div class="p-3 bg-light rounded-3 border-start border-4 border-primary-subtle">
              <p class="text-muted small fst-italic mb-0">"${escapeHtml(data.example || "No example available.")}"</p>
            </div>
          </div>
        </div>`;
    };

    /* ══════════════════════════════════════════
       COLLECTIONS / FLASHCARDS
    ══════════════════════════════════════════ */
    const getCardContentOnly = (word) => `
      <div class="flip-card ${state.isFlipped ? 'flipped' : ''}" onclick="window.toggleFlip()">
        <div class="flip-card-inner">
          <div class="flip-card-front card d-flex flex-column justify-content-center align-items-center p-4">
            <div class="position-absolute top-0 end-0 p-3">
              <i class="bi ${state.favorites.has(word) ? 'bi-star-fill text-warning' : 'bi-star text-secondary-subtle'} fs-4"
                 data-fav-icon="${word}"
                 onclick="event.stopPropagation(); window.handleToggleFav(event, '${word}')"></i>
            </div>
            <h1 class="display-5 fw-bold text-dark text-center px-3 text-break">${word}</h1>
          </div>
          <div class="flip-card-back card d-flex flex-column p-4 text-start">
            <h4 class="fw-bold mb-3 border-bottom pb-2 text-primary text-truncate">${word}</h4>
            <div class="overflow-auto scroll-container pe-2">${getDetailHtmlSnippet(word)}</div>
          </div>
        </div>
      </div>`;

    const updateFlashcardUI = () => {
      const wrapper = document.getElementById("flashcard-wrapper");
      if (!wrapper || state.viewSnapshot.length === 0) return;
      const currentWord = state.viewSnapshot[state.collectionIndex];

      ensureWordData(currentWord).then(() => {
        const w2 = state.viewSnapshot[state.collectionIndex];
        if (w2 === currentWord) {
          const wrapper2 = document.getElementById("flashcard-wrapper");
          if (wrapper2) wrapper2.innerHTML = getCardContentOnly(currentWord);
        }
      });

      wrapper.className = "mx-3";
      void wrapper.offsetWidth;
      wrapper.className = `mx-3 ${state.currentAnim}`;
      wrapper.innerHTML = getCardContentOnly(currentWord);
    };

    /* ══════════════════════════════════════════
       EVENT HANDLERS
    ══════════════════════════════════════════ */
    window.handleWordClick = async (word) => {
      state.selectedWord = word;

      if (state.view === "collections") {
        const oldIndex = state.collectionIndex;
        state.collectionIndex = state.viewSnapshot.indexOf(word);
        state.currentAnim = state.collectionIndex >= oldIndex ? "slide-right" : "slide-left";
        state.isFlipped = false;
        updateFlashcardUI();
        ensureWordData(word).then(updateFlashcardUI);
        return;
      }

      const listLayer   = document.getElementById("list-layer");
      const detailLayer = document.getElementById("detail-layer");
      const detailTitle = document.getElementById("detail-title");
      const detailBody  = document.getElementById("detail-body");
      const detailFav   = document.getElementById("detail-fav-icon");
      if (!(listLayer && detailLayer)) return;

      listLayer.classList.add("d-none");
      detailLayer.classList.remove("d-none");

      detailTitle.innerHTML = `<div class="fw-bold" style="font-size: 1.05rem">${escapeHtml(word)}</div>`;
      detailBody.innerHTML  = '<div class="p-4 text-muted small">Loading definition...</div>';

      await ensureWordData(word);
      detailBody.innerHTML = getDetailHtmlSnippet(word);

      detailFav.setAttribute("onclick",       `window.handleToggleFav(event, '${word}')`);
      detailFav.setAttribute("data-fav-icon", word);
      detailFav.className = `bi ${state.favorites.has(word) ? "bi-star-fill text-warning" : "bi-star text-secondary-subtle"} fs-5`;
    };

    window.closeDetail = () => {
      state.selectedWord = null;
      document.getElementById("list-layer")?.classList.remove("d-none");
      document.getElementById("detail-layer")?.classList.add("d-none");
    };

    window.handleToggleFav = (e, word) => {
      e.stopPropagation();
      const isAdding = !state.favorites.has(word);
      if (isAdding) state.favorites.add(word); else state.favorites.delete(word);
      document.querySelectorAll(`[data-fav-icon="${word}"]`).forEach(icon => {
        const sz = icon.classList.contains("fs-4") ? "fs-4" : icon.classList.contains("fs-5") ? "fs-5" : "";
        icon.className = `bi ${isAdding ? "bi-star-fill text-warning" : "bi-star text-secondary-subtle"} ${sz}`;
      });
      persistState();
    };

    window.setView = (view) => {
      state.view = view;
      state.selectedWord = null;
      if (view === "collections") {
        state.viewSnapshot   = Array.from(state.favorites);
        state.collectionIndex = 0;
        state.isFlipped       = false;
        state.currentAnim     = "fade-in";
      }
      render();
    };

    window.goHome = () => {
      cancelSpeech();
      if (state.fileData?.url) URL.revokeObjectURL(state.fileData.url);
      state.view = "upload"; state.fileData = null;
      state.selectedWord = null;
      state.words = [];
      state.wordData = {};
      // Persist immediately so stale wordData isn't reloaded on next page load
      persistState();
      render();
    };

    window.nextCard = () => {
      if (state.viewSnapshot.length <= 1) return;
      state.collectionIndex = (state.collectionIndex + 1) % state.viewSnapshot.length;
      state.isFlipped = false; state.currentAnim = "slide-right";
      updateFlashcardUI();
    };

    window.prevCard = () => {
      if (state.viewSnapshot.length <= 1) return;
      state.collectionIndex = (state.collectionIndex - 1 + state.viewSnapshot.length) % state.viewSnapshot.length;
      state.isFlipped = false; state.currentAnim = "slide-left";
      updateFlashcardUI();
    };

    window.toggleFlip = () => {
      state.isFlipped = !state.isFlipped;
      const card = document.querySelector(".flip-card");
      if (card) card.classList.toggle("flipped", state.isFlipped);
    };

    /* ── Add word manually ── */
    window.handleAddWord = async () => {
      const rawWord = prompt("Enter the word you want to add:");
      if (rawWord === null) return;
      const word = rawWord.trim(); if (!word) return;

      // Only check the CURRENT session's word list — not favorites from other sessions
      if (state.words.some(w => (w || "").toLowerCase() === word.toLowerCase())) {
        alert("This word already exists in your list."); return;
      }

      // Always force a fresh lookup by removing any stale/empty cached entry
      delete state.wordData[word];
      await ensureWordData(word);
      if (!state.wordData[word]) state.wordData[word] = { meaning: "", example: "" };
      if (!state.words.includes(word)) state.words.push(word);
      state.words = Array.from(new Set(state.words)).sort((a, b) => a.localeCompare(b));

      persistState();
      render();
      setTimeout(() => window.handleWordClick(word), 0);
    };

    /* ── Import JSON ── */
    window.triggerUploadJson = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json";
      inp.onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const json = JSON.parse(ev.target?.result);
            if (json.words && json.wordData) {
              state.words    = json.words;
              state.wordData = { ...state.wordData, ...json.wordData };
              persistState();
              render();
              setTimeout(() => loadPdfIntoViewer(false).catch(console.error), 0);
            } else { alert("Invalid JSON format."); }
          } catch { alert("Invalid file."); }
        };
        reader.readAsText(file);
      };
      inp.click();
    };

    /* ── Download JSON ── */
    window.downloadJson = () => {
      const data = { words: state.words, wordData: state.wordData };
      if (data.words.length === 0) { alert("Nothing to export."); return; }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "glossary.json"; a.click();
      URL.revokeObjectURL(url);
    };

    /* ── AI Extract (called automatically after PDF upload) ── */
    const runAiExtract = async () => {
      if (state.isProcessing || !state.fileData?.file) return;
      state.isProcessing = true;
      let poller = null;

      const setProgress = (s) => {
        const el = document.getElementById("keywords-label");
        if (el) el.innerHTML = s;
      };
      setProgress(`<span class="spinner-border spinner-border-sm me-1"></span> Extracting…`);

      poller = setInterval(async () => {
        try {
          const r = await fetch("/api/progress"); if (!r.ok) return;
          const p = await r.json().catch(() => ({}));
          const cur   = Number(p.current ?? 0) || 0;
          const total = Number(p.total   ?? 0) || 0;
          setProgress(`<span class="spinner-border spinner-border-sm me-1"></span> ${cur}/${total > 0 ? total : "?"}`);
        } catch {}
      }, 500);

      try {
        const formData = new FormData(); formData.append("pdf", state.fileData.file);
        const resp = await fetch("/api/extract_keywords", { method: "POST", body: formData });
        if (!resp.ok) { setProgress("Keywords"); alert("Backend error when extracting vocabulary."); return; }
        const data = await resp.json();
        state.words    = (Array.isArray(data.words) ? data.words.slice() : []).sort((a, b) => a.localeCompare(b));
        state.wordData = { ...state.wordData, ...(data.wordData || {}) };
        persistState();
        state._pdfRenderedScale = null;
        render();
        setTimeout(() => loadPdfIntoViewer(true).catch(console.error), 0);
      } catch (err) {
        console.error(err);
        setProgress("Keywords");
        alert("Failed to call backend. Check if server.py is running.");
      } finally {
        state.isProcessing = false;
        if (poller) clearInterval(poller);
        const el = document.getElementById("keywords-label");
        if (el) el.textContent = "Keywords";
      }
    };

    /* ── PDF Upload — auto-starts AI extract ── */
    window.handleMainUpload = async (e) => {
      const file = e.target.files[0];
      if (!file || file.type !== "application/pdf") return;
      state.articleText = ""; state.articleTextLoaded = false;
      state.words    = [];
      state.wordData = {};
      state.fileData = { name: file.name, url: URL.createObjectURL(file), file };
      state.pdfBuf   = await file.arrayBuffer();
      state._pdfRenderedScale = null;
      state.view = "content";
      render();
      await new Promise(r => setTimeout(r, 0));
      await loadPdfIntoViewer(true);
      runAiExtract();   // intentionally not awaited — runs in background
    };

    /* ══════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════ */
    const render = () => {
      const root = document.getElementById("root"); if (!root) return;

      /* ── Upload screen ── */
      if (state.view === "upload") {
        root.innerHTML = `
          <div class="h-100 d-flex flex-column justify-content-center align-items-center fade-in">
            <input type="file" id="mainFileInput" class="d-none" accept="application/pdf"
                   onchange="window.handleMainUpload(event)">
            <div class="position-relative" style="width: 300px; height: 300px;">
              <div onclick="document.getElementById('mainFileInput').click()"
                   class="position-absolute top-50 start-50 translate-middle bg-white border
                          border-secondary-subtle rounded-3 shadow-sm d-flex flex-column
                          justify-content-center align-items-center"
                   style="width: 140px; height: 160px; cursor: pointer; z-index: 10">
                <div class="rounded-circle d-flex align-items-center justify-content-center mb-2"
                     style="width: 50px; height: 50px; background-color: #38961D;">
                  <i class="bi bi-plus fs-2 text-white"></i>
                </div>
                <span class="fw-medium text-secondary" style="font-size: 13px">Upload PDF</span>
              </div>
              <div class="w-100 h-100 border border-dashed rounded-circle"
                   style="border-color: #FFD700; background-color: #38961D; border-width: 10px;"></div>
              <img src="/spartan-logo.png" alt="MSU Spartan" class="upload-logo upload-logo-left">
              <img src="/spartan-logo.png" alt="MSU Spartan" class="upload-logo upload-logo-right">
            </div>
            <button onclick="window.setView('collections')"
                    class="btn btn-outline-dark rounded-pill px-5 py-2 mt-5 text-uppercase fw-bold shadow-sm"
                    style="font-size: 12px; letter-spacing: 2px">Collections</button>
          </div>`;
        return;
      }

      const isColl = state.view === "collections";
      const list   = isColl ? state.viewSnapshot : state.words;

      root.innerHTML = `
        <div class="app-container">
          <div class="row h-100 g-3 flex-nowrap">

            <!-- Home button -->
            <div class="col-auto d-flex flex-column align-items-center pt-2">
              <button onclick="window.goHome()"
                      class="btn btn-outline-secondary rounded-circle mb-4 d-flex
                             align-items-center justify-content-center shadow-sm"
                      style="width: 48px; height: 48px">
                <i class="bi bi-house-door-fill"></i>
              </button>
            </div>

            <!-- Main content column -->
            <div class="col d-flex flex-column" style="min-width: 0">
              <div class="custom-card shadow-sm ${isColl ? 'bg-light-subtle' : ''}">

                <!-- Header -->
                <div class="content-header bg-white px-3 justify-content-center">
                  <i class="bi ${isColl ? 'bi-bookmarks-fill text-primary' : 'bi-file-earmark-pdf text-danger'} me-2"></i>
                  <span class="small fw-bold text-dark text-truncate">
                    ${isColl ? `Study Deck (${state.favorites.size})` : (state.fileData?.name || '')}
                  </span>
                </div>

                <div class="flex-grow-1 d-flex align-items-center justify-content-center p-3 overflow-hidden"
                     id="deck-container">
                  ${isColl ? `
                    <!-- Collections / flashcard view -->
                    <div class="d-flex align-items-center justify-content-center w-100" style="max-width: 850px">
                      ${state.viewSnapshot.length > 0 ? `
                        <button onclick="window.prevCard()"
                                class="btn nav-btn shadow-sm rounded-circle d-flex align-items-center justify-content-center">
                          <i class="bi bi-chevron-left"></i>
                        </button>
                        <div id="flashcard-wrapper" class="mx-3 ${state.currentAnim}">
                          ${getCardContentOnly(state.viewSnapshot[state.collectionIndex])}
                        </div>
                        <button onclick="window.nextCard()"
                                class="btn nav-btn shadow-sm rounded-circle d-flex align-items-center justify-content-center">
                          <i class="bi bi-chevron-right"></i>
                        </button>
                      ` : `
                        <div class="text-center p-5 bg-white rounded-4 shadow-sm fade-in" style="max-width: 400px">
                          <div class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center mb-4"
                               style="width: 80px; height: 80px">
                            <i class="bi bi-bookmarks text-secondary fs-1"></i>
                          </div>
                          <h4 class="fw-bold">No Collections</h4>
                          <button onclick="window.goHome()" class="btn btn-dark rounded-pill px-4 mt-3">Go Home</button>
                        </div>
                      `}
                    </div>
                  ` : `
                    <!-- PDF viewer -->
                    <div class="h-100 d-flex flex-column w-100">
                      <!-- Zoom toolbar -->
                      <div class="d-flex align-items-center gap-2 px-2 py-2 border-bottom bg-white flex-shrink-0">
                        <div class="btn-group btn-group-sm">
                          <button class="btn btn-outline-dark" onclick="window.zoomPdf(-0.1)" title="Zoom out">
                            <i class="bi bi-zoom-out"></i>
                          </button>
                          <button class="btn btn-outline-dark disabled" tabindex="-1" style="min-width:70px">
                            ${Math.round((state.pdfZoom || 1) * 100)}%
                          </button>
                          <button class="btn btn-outline-dark" onclick="window.zoomPdf(0.1)" title="Zoom in">
                            <i class="bi bi-zoom-in"></i>
                          </button>
                        </div>
                        <span class="small text-muted ms-2 d-none d-md-block">
                          Select text on the PDF to highlight / copy / read aloud.
                        </span>
                      </div>

                      <!--
                        PDF scroll wrapper:
                        flex-grow:1  → takes remaining vertical space
                        min-height:0 → lets flexbox shrink it (critical for scroll to work!)
                        position:relative → anchors the absolutely-positioned .pdf-host
                      -->
                      <div class="flex-grow-1 position-relative mt-2" style="min-height: 0">
                        <div id="pdfHost" class="pdf-host">
                          <div id="pdfPages" class="pdf-pages"></div>
                        </div>
                      </div>
                    </div>
                  `}
                </div>
              </div>
            </div>

            <!-- Sidebar -->
            <div id="sidebar-container">
              <div class="custom-card shadow-sm h-100 position-relative">

                <!-- Word list layer -->
                <div id="list-layer" class="sidebar-layer">
                  <div class="sidebar-header px-3">
                    <div class="header-action-area">
                      <button onclick="window.triggerUploadJson()"
                              class="btn btn-sm btn-outline-secondary border-0 rounded-circle p-0"
                              style="width: 32px; height: 32px" title="Import JSON">
                        <i class="bi bi-upload"></i>
                      </button>
                    </div>
                    <div class="flex-grow-1 text-center overflow-hidden">
                      <span class="fw-bold text-dark text-truncate d-block small" id="keywords-label">
                        ${isColl ? "Collections" : "Keywords"}
                      </span>
                    </div>
                    <div class="header-action-area">
                      <button onclick="window.handleAddWord()"
                              class="btn btn-sm btn-outline-secondary border-0 rounded-circle p-0"
                              style="width: 32px; height: 32px" title="Add word">
                        <i class="bi bi-plus-lg"></i>
                      </button>
                    </div>
                    <div class="header-action-area">
                      <button onclick="window.downloadJson()"
                              class="btn btn-sm btn-outline-secondary border-0 rounded-circle p-0"
                              style="width: 32px; height: 32px" title="Export JSON">
                        <i class="bi bi-download"></i>
                      </button>
                    </div>
                  </div>

                  <div class="flex-grow-1 overflow-y-auto scroll-container bg-white">
                    <div class="list-group list-group-flush">
                      ${list.map(word => `
                        <div class="list-group-item list-group-item-action border-0 px-4 py-3
                                    d-flex justify-content-between align-items-center"
                             onclick="window.handleWordClick('${word}')"
                             data-word-item="${word}" style="cursor: pointer">
                          <span class="small fw-medium text-dark">${escapeHtml(word)}</span>
                          <i class="bi ${state.favorites.has(word) ? 'bi-star-fill text-warning' : 'bi-star text-secondary-subtle'}"
                             data-fav-icon="${word}"
                             onclick="window.handleToggleFav(event, '${word}')"></i>
                        </div>`).join("")}
                      ${list.length === 0
                        ? '<p class="p-4 text-center text-muted small">No items.</p>'
                        : ""}
                    </div>
                  </div>


                </div>

                <!-- Word detail layer -->
                <div id="detail-layer" class="sidebar-layer d-none">
                  <div class="sidebar-header px-3">
                    <div class="header-action-area">
                      <button onclick="window.closeDetail()"
                              class="btn btn-sm btn-light rounded-circle p-0"
                              style="width: 32px; height: 32px">
                        <i class="bi bi-arrow-left"></i>
                      </button>
                    </div>
                    <div class="flex-grow-1 text-center overflow-hidden">
                      <span class="fw-bold text-dark text-truncate d-block small" id="detail-title"></span>
                    </div>
                    <div class="header-action-area">
                      <i class="bi bi-star text-secondary-subtle fs-5"
                         style="cursor: pointer" id="detail-fav-icon"></i>
                    </div>
                  </div>
                  <div class="flex-grow-1 overflow-y-auto scroll-container bg-white" id="detail-body"></div>
                </div>

              </div>
            </div>

          </div>
        </div>`;

      setTimeout(() => loadPdfIntoViewer(false).catch(console.error), 0);
    };

    /* boot */
    loadPersistedState();
    render();
  </script>
</body>
</html>
